<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Reverse Duet</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="connect" class="connect">
    <section class="panel">
      <header class="brand">
        <img src="logo.svg" alt="" width="40" height="40">
        <div>
          <h1>Reverse Duet</h1>
          <p id="mac-name" class="muted">Looking for your Mac…</p>
        </div>
      </header>

      <form id="connect-form" autocomplete="off">
        <div id="code-field" class="field">
          <label for="code">Pairing code</label>
          <p class="muted small">Shown in Reverse Duet › My Devices on your Mac.</p>
          <div class="code-boxes" id="code-boxes">
            <input inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 1">
            <input inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 2">
            <input inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 3">
            <input inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 4">
          </div>
        </div>

        <div class="field">
          <label>Use this device to</label>
          <div class="segmented" id="mode">
            <button type="button" data-value="extend" class="active">Extend</button>
            <button type="button" data-value="mirror">Mirror</button>
          </div>
          <p class="muted small" id="mode-hint">Becomes a second screen next to your Mac's display.</p>
        </div>

        <label class="check"><input type="checkbox" id="retina" checked><span></span>Retina (sharper, uses more bandwidth)</label>
        <label class="check"><input type="checkbox" id="fullscreen" checked><span></span>Go full screen</label>
        <label class="check"><input type="checkbox" id="swap-modifiers"><span></span>Use Ctrl as ⌘ Command</label>

        <p id="secure-tip" class="tip" hidden></p>
        <p id="error" class="error" role="alert" hidden></p>

        <button type="submit" class="primary" id="connect-button">Connect</button>
      </form>
      <footer class="muted small" id="footer">Keep this page open while connected. Both devices must be on the same network.</footer>
    </section>
  </main>

  <div id="stage" class="stage" hidden>
    <canvas id="screen" tabindex="0"></canvas>
    <div id="toolbar" class="toolbar">
      <button type="button" id="tb-fullscreen" title="Full screen">⛶</button>
      <button type="button" id="tb-keyboard" title="Keyboard">⌨︎</button>
      <button type="button" id="tb-stats" title="Statistics">ⓘ</button>
      <button type="button" id="tb-disconnect" class="danger" title="Disconnect">✕</button>
    </div>
    <div id="stats" class="stats" hidden></div>
    <div id="status" class="status" hidden></div>
    <textarea id="keyboard-sink" class="keyboard-sink" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" aria-hidden="true"></textarea>
  </div>

  <script src="app.js"></script>
</body>
</html>
